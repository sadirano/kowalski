# A version tag (v1.2.3) checks that it matches build.zig.zon, tests and
# builds. Releases are signed and published by hand (docs/releasing.md).
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: The tag matches build.zig.zon
        shell: pwsh
        run: |
          $want = '${{ github.ref_name }}'.TrimStart('v')
          $have = (Select-String -Path build.zig.zon -Pattern '\.version = "([^"]+)"').Matches[0].Groups[1].Value
          if ($want -ne $have) { throw "tag ${{ github.ref_name }} but build.zig.zon says $have" }

      - run: zig build test

      - run: zig build -Doptimize=ReleaseSafe
