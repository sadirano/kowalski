# A version tag (v1.2.3, or v1.2.3-preview.N for the version it leads to)
# checks that it matches build.zig.zon, tests and builds. Releases are
# signed and published by hand (docs/releasing.md).
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: The tag matches build.zig.zon
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          if ($tag -notmatch '^v(\d+\.\d+\.\d+)(-preview\.(\d+))?$') { throw "tag $tag is not vX.Y.Z or vX.Y.Z-preview.N" }
          $want = $Matches[1]
          $have = (Select-String -Path build.zig.zon -Pattern '\.version = "([^"]+)"').Matches[0].Groups[1].Value
          if ($want -ne $have) { throw "tag $tag but build.zig.zon says $have" }
          # A preview keeps the coming stable version and builds with -Dpreview=N.
          "PREVIEW_FLAG=$(if ($Matches[3]) { '-Dpreview=' + $Matches[3] } else { '' })" | Out-File -Append $env:GITHUB_ENV

      - run: zig build test

      - shell: pwsh
        run: zig build -Doptimize=ReleaseSafe @("$env:PREVIEW_FLAG" -split ' ' | Where-Object { $_ })
