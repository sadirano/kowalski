# A version tag (v1.2.3) builds the Windows zip and publishes it as a
# GitHub release, with the tag's message as the notes.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: The tag matches build.zig.zon
        shell: pwsh
        run: |
          $want = '${{ github.ref_name }}'.TrimStart('v')
          $have = (Select-String -Path build.zig.zon -Pattern '\.version = "([^"]+)"').Matches[0].Groups[1].Value
          if ($want -ne $have) { throw "tag ${{ github.ref_name }} but build.zig.zon says $have" }

      - run: zig build test

      - run: zig build -Doptimize=ReleaseSafe

      - name: Package
        shell: pwsh
        run: |
          $name = 'kowalski-${{ github.ref_name }}-windows-x86_64'
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item zig-out/bin/kowalski.exe, zig-out/bin/kowalskiw.exe, README.md, LICENSE $name
          Copy-Item src/ui/vendor/LICENSE-chart.js.txt $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"

      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ github.ref_name }}' 'kowalski-${{ github.ref_name }}-windows-x86_64.zip' --title 'kowalski ${{ github.ref_name }}' --notes-from-tag --verify-tag
